[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autocover"
version = "0.1.0"
description = "Generate blog cover images (OG images) from the command line"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Neandertech" },
]
dependencies = [
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
mcp = [
    "mcp>=1.0.0,<2.0.0",
]

[project.scripts]
autocover = "autocover.cli:main"
autocover-mcp = "autocover.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autocover"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
